    title: "Reproduce the numbers"
    shipped: "From the tables of this panel (benford_hist, benford_base, benford_stat):"
    raw: "From the polling stations (import the states first in Drill down; the digit counts are the same):"
  teaser:
    body: "The full analysis (1st and 2nd digit, simulated baseline, maps and ranking) is in the Benford view. Counts per polling station have a bounded size and deviate from Benford's law even with no manipulation; a deviation is only statistical."
    link: "open the Benford analysis"
