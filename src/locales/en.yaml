residual:
  label: Include votes from sections without files (official municipal total)
  hint: Adds to the national, state and municipal totals the votes that the official total (of the zone or municipality) has beyond the sections with published files. There is no section-level detail, so sections and section-based analyses do not include them.

overview:
  title: "Overview · {election}"
  national: National result
  partyAggregate: Votes aggregated by party (first two digits of the number); governor and senator add up all states.
  included: The totals include {votes} votes from {sections} sections that the TSE did not publish, taken from each municipality's official total (no section-level detail).
  seeCoverage: see Data coverage
  gapLeft: "Remaining difference from the official result: {votes} votes ({share})."
  gapLeftSkipped: "Remaining difference from the official result: {votes} votes ({share}) · municipalities whose official total could not be used (not tallied, outdated or missing): {skipped}."
  gap: "Difference from the official result: {votes} votes ({share}) · sections without a published file: {missing}."
  official: "official {n}"
  unlisted: Numbers outside the TSE candidate list appear as "{label}" (the TSE site counts them as invalid).
  polarization: "Polarization: valid votes of the top two"
  polarizationNote: Circle area is proportional to the share of nominal (valid) votes according to the official TSE totals. Elections with many candidates and runoffs (two) are not directly comparable.
  polarizationLabel: "Polarization: share of the two leading candidates in the valid votes, circles with proportional area"
  winnerByState: Winner by state
  winnerMapLabel: Map of Brazil by state, coloured by the leading candidate
  winnerNote: Colour of the leading candidate in each state; stronger = larger margin. Click a state to see its municipalities.
  seeMaps: See maps
  byState: By state

