  ranking:
    title: "Ranking by adjusted deviation"
    n: "Sample (N)"
    mad: "MAD"
    base: "Baseline MAD"
    index: "Adjusted index"
    excess: "Relative difference"
    flag: "Position"
    open: "open"
    detail: "drill down"
    note: "Sorted from the highest index to the lowest. Being above the envelope is a statistical deviation, never a conclusion about the votes."
    empty: "No place with enough N."
    shown: "showing {shown} of {total}"
  explainer:
    title: "How to read this page"
    law:
      title: "What Benford's law says"
      p1: "In many sets of numbers that spread over several orders of magnitude, the first digit 1 appears in about 30% of the cases, the 2 in 18% and the 9 in only 4.6%: P(d) = log10(1 + 1/d). The second digit is much more uniform (0 in 12%, 9 in 8.5%) and the first two digits follow log10(1 + 1/dd), from 10 to 99. The last digit, in data without rounding, should be uniform (10% each)."
    heuristic:
      title: "Why it is a heuristic, not a proof"
      p1: "The law is not a rule of nature: it holds when values spread smoothly over several orders of magnitude. It serves as a screen, that is, to decide where to look more carefully, never to conclude what happened. Deckert, Myagkov and Ordeshook (Political Analysis, 2011) tested the law in simulations and in real elections and conclude that conformity and deviations follow no pattern."
    sections:
      title: "Why polling-station counts do not obey the law"
      p1: "A polling station has at most a few hundred voters. In a station of 300 voters, a candidate with 40% of the votes gets something close to 120, almost always between 100 and 140. Because the station size is bounded and the candidate's share stays near the mean, counts concentrate in a narrow range: the first digit comes to reflect where that range falls (in stations of 200 voters this candidate lands on 80, in stations of 300 on 120), not a law about numbers. The premise of several orders of magnitude does not hold, and this happens with no manipulation at all."
    second:
      title: "What the 2nd digit and the baseline add"
      p1: "The second digit is much less sensitive to this effect and is the test recommended in the election-forensics literature (Mebane, 2006, proposed the 2nd-digit test for polling-station counts). Even so, station counts do not follow it exactly."
      p2: "That is why every cut comes with a baseline: for each station we draw a binomial count with the real size of the station (nominal, blank and null votes) and the candidate's share in the municipality; for municipalities, the state share; for states, the national share. There are 200 replicates with a fixed seed, and we keep the mean and the 2.5% to 97.5% envelope of each digit. The chart shows the observed values, Benford's law and that envelope, and we only flag deviations of the observed values outside the simulated envelope."
    flag:
      title: "What a flagged deviation can and cannot mean"
      p1: "Even so, being outside the envelope proves nothing. The baseline has only binomial chance: heterogeneity between neighbourhoods and ballot boxes, geography, turnout, voters transferred between stations, rounding and typing errors legitimately widen the envelope. A flagged deviation may indicate that the real process differs from the simple model; it does not identify the cause, does not measure intent and does not assign responsibility. The absence of a deviation does not prove that everything is correct either."
      p2: "In a cut with hundreds of thousands of stations the envelope becomes very narrow and almost every observed value falls outside it, usually below (closer to Benford, because real stations are more heterogeneous than the model). So look at the size of the difference (MAD and adjusted index), not only at whether it is inside or outside."
    read:
      title: "How to read MAD, χ² and N"
      p1: "MAD is the mean absolute deviation between the observed proportion of each digit and the expected one. Nigrini (2012) proposes empirical bands: 1st digit, up to 0.006 close conformity, up to 0.012 acceptable, up to 0.015 marginal and above that nonconformity; 2nd digit, 0.008, 0.010 and 0.012; first two digits, 0.0012, 0.0018 and 0.0022. The bands measure distance to the law, not manipulation, and do not exist for the last digit."
      p2: "Pearson's χ² compares counts and, with N in the hundreds of thousands, always rejects Benford's law (p-value practically zero), even for tiny deviations. So the reading rests on the size of the deviation (MAD, the z of each digit with continuity correction and the 95% band) and on the simulated envelope."
      p3: "N is the number of values that have the digit. Below the minimum N we only show \"small sample\": it is the smallest N at which the rarest digit is expected at least 5 times (1st digit: {minD1}; 2nd: {minD2}; first two: {minD12}; last: {minLast}). The MAD also has a noise floor: with a small N not even a perfect sample reaches the close-conformity band, and the MAD expected by chance alone is shown among the measures."
    included:
      title: "What is included"
      sections: "Polling stations: the counts of each station (main unit); municipalities and states as secondary units (total votes of each municipality or state; municipalities and states leave out the votes abroad)."
      president: "President: candidates with at least {nationalShare} of the nominal votes nationwide, with the same rule in the states; those with {munNationalShare} or more, and the nominal total, also in municipalities with {munSections} stations or more."
      local: "Governor and senator: candidates with at least {localShare} of the state's nominal votes; those with {bigShare} or more also get the municipality and state units, and those with {munLocalShare} or more, municipalities with {munSectionsOther} stations or more."
      deputies: "Deputies: totals per state and party blocs (the first two digits of the number) with at least {localShare} of the nominal votes."
      totals: "Station totals: nominal, blank and null votes."
      digits: "First two digits: president and nominal totals (nationwide and per state), and only where N reaches {minD12}. Municipalities appear only when they have enough stations."
    sources:
      title: "References checked"
      deckert: "Deckert, J.; Myagkov, M.; Ordeshook, P. C. Benford's Law and the Detection of Election Fraud. Political Analysis 19(3), 2011, p. 245-268."
      mebane: "Mebane, W. R. Election Forensics: Vote Counts and Benford's Law (2006), the second-digit test."
      nigrini: "Nigrini, M. J. Benford's Law: Applications for Forensic Accounting, Auditing, and Fraud Detection. Wiley, 2012 (MAD bands)."
