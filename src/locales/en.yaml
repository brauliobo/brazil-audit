  tablesTitle: Tables and views
  rows_one: "{count} row"
  rows_other: "{count} rows"
  showing: (showing {n})
  examples:
    uf: Leading candidate by state
    ranking: Municipality ranking by the first place's votes
    outliers: Sections with an atypical size in the municipality (z-score, AC)
    names: Votes per candidate (president), with names
    time: Votes per 10 minutes (local clock)
    cross: "President: winner and % by state in each loaded election"
    parts: Parts loaded in the browser
    catalog: "Catalog: tables, columns and elections"
  tables:
    rdv: "section and office results (votes = jsonb {number: votes})"
    sec: rdv view without the jsonb
    cs: "view: one row per section, office and candidate"
    tot: totals per municipality and office
    res: votes per candidate (municipality; deputies per state)
    resx: "view: res + votes of sections without files"
    totx: "view: tot + votes of sections without files"
    vt: voting times per section
    vtc: times per municipality
    cov: coverage per state
    miss: sections without files
