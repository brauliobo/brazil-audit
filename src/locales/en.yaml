sources:
  title: Data sources
  intro: "Priority order: the most granular source that exists wins. The ballot-box logs record every vote with its time, but only the office, never the candidate; the votes by candidate and party come from the RDV, and the logs serve the voting times and the cross-check of the number of ballots per section and office."
  layer:
    logs:
      name: Ballot-box logs
      role: "Every confirmed vote with its time: the most granular source and the only one with times. It carries only the office, never the candidate."
    rdv:
