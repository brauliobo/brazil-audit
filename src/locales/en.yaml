    mun_map: municipality → IBGE code

coverage:
  title: Data coverage
  withResult: of the sections with a result in this dump
  ofSections: "of {n} sections"
  missing: without files published by the TSE
  aggregated_one: "{count} aggregated section has no files of its own: its votes are already counted in the main section and do not count as missing. Without adding the votes of these sections (see below), the totals only cover the sections with a result (the TSE tallied 100%)."
  aggregated_other: "{count} aggregated sections have no files of their own: their votes are already counted in the main section and do not count as missing. Without adding the votes of these sections (see below), the totals only cover the sections with a result (the TSE tallied 100%)."
  byState: By state
  residualSummary: Votes of sections without files, taken from the official municipal total
  residualNote: Each vote here comes from the official zone or municipal total (minus what the sections with files add up to), not from section files; that is why they only enter the national, state and municipal totals and the row of each zone.
  skippedCount: "Municipalities and offices without addition, all offices ({n}; the Overview counts only the president's, {president}):"
  unmatchedNote_one: "{count} section without a file received no addition: the official total of its municipality or post (abroad) already matches the sections we have, so it had no votes."
  unmatchedNote_other: "{count} sections without a file received no addition: the official total of their municipality or post (abroad) already matches the sections we have, so they had no votes."
  lostSummary: "Sections without a result ({n})"
  sectionsWithoutFile: Sections without a file
  votesPresident: Votes (president)
  reason: Reason
  reasons:
    not_totalized: official total not yet tallied
    negative: official total lower than the sections we have (outdated file)
    no_official_file: no official file for the municipality
    zone_files_disagree: the zone files do not add up to the municipal file (municipal total used)
  ownFiles: Sections with their own files
  stored: With a result in the dump
  noResult: Without a published result
  aggregatedCol: Aggregated into another section
  sectionsInDump: sections in the dump
  noBlank: "Blank and null ballots were not collected for this election: the dump only has the nominal votes per candidate."

