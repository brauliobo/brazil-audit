  rules:
    title: Regras e fontes
    intro: A regra de cada eleição é um dado de configuração, não código. O cálculo é sempre o mesmo e só mudam os mínimos e as etapas das sobras.
    own: Regra desta eleição
    applied: Aplicada agora, como hipótese
    ownShort: regra da eleição
    whatIf: hipótese
  ruleShort:
    coalitions2018: Coligações 2018
    federations2022: Lei 14.211/2021
    stf2024: STF (ADI 7228)
  ruleName:
    coalitions2018: "2018: coligações (Lei 13.488/2017)"
    federations2022: "Lei 14.211/2021: 80% e 20% nas duas etapas das sobras"
    stf2024: "STF (ADIs 7228, 7263 e 7325): sobras abertas a todos na última etapa"
  ruleText:
    coalitions2018: Coligações proporcionais eram permitidas e contam como uma lista. O candidato precisa de 10% do quociente eleitoral para ocupar vaga do quociente partidário. As sobras vão pela maior média entre todos os partidos e coligações, mesmo os que não alcançaram o quociente (Lei 13.488/2017), primeiro entre listas com candidato de pelo menos 10% do quociente e depois sem mínimo. Se nenhuma lista alcança o quociente, vencem os mais votados.
    federations2022: Coligações proporcionais foram vedadas e as federações contam como um partido. Candidato com 10% do quociente para vaga do quociente partidário. Sobras, primeira etapa, só entre listas com 80% do quociente e candidatos com 20%; segunda etapa, só entre listas com 80%, sem mínimo para o candidato. É a regra com que o TSE proclamou o resultado de 2022; a decisão do STF a alterou depois (veja a regra seguinte).
    stf2024: Mesma primeira etapa (80% e 20%). Em 28/02/2024 o STF decidiu que a etapa final das sobras é aberta a todos os partidos e federações, sem mínimo, e derrubou o art. 111 (se ninguém alcança o quociente, tudo vai pela maior média). Em 13/03/2025 os embargos fizeram a decisão valer desde 2022 e o TSE refez a totalização dos deputados federais (AP, DF, RO e TO mudaram). É a regra da Res. TSE 23.677 com as redações de 2024 e 2026, e a que vale para 2026.
  sources:
    ce: Código Eleitoral (Lei 4.737/1965), arts. 106 a 112, texto compilado
    law13488: Lei 13.488/2017 (sobras para todos os partidos e coligações)
    res23554: Res. TSE 23.554/2017 (eleições de 2018), arts. 7 a 12
    law14211: Lei 14.211/2021 (fim das coligações proporcionais, 80% e 20% nas sobras)
    res23677: Res. TSE 23.677/2021 compilada, arts. 8 a 14 e 20 a 24 (redações de 2024 e 2026)
    stf2024: "STF, 28/02/2024: sobras eleitorais (ADIs 7228, 7263 e 7325)"
    stf2025: "STF, 13/03/2025: a decisão vale desde as eleições de 2022"
    res23748: "Res. TSE 23.748/2026 (art. 12-A: sobras em duas etapas)"

