    empty: "Nenhum local com N suficiente."
    shown: "mostrando {shown} de {total}"
  explainer:
    title: "Como ler esta página"
    law:
      title: "O que diz a Lei de Benford"
      p1: "Em muitos conjuntos de números que se espalham por várias ordens de grandeza, o primeiro dígito 1 aparece em cerca de 30% dos casos, o 2 em 18% e o 9 em apenas 4,6%: P(d) = log10(1 + 1/d). O segundo dígito é bem mais uniforme (0 em 12%, 9 em 8,5%) e os dois primeiros dígitos seguem log10(1 + 1/dd), de 10 a 99. O último dígito, em dados sem arredondamento, deve ser uniforme (10% cada)."
    heuristic:
      title: "Por que é uma heurística, e não uma prova"
      p1: "A lei não é uma regra da natureza: vale quando os valores se espalham de forma suave por várias ordens de grandeza. Serve para triagem, isto é, para decidir onde olhar com mais cuidado, nunca para concluir o que aconteceu. Deckert, Myagkov e Ordeshook (Political Analysis, 2011) testaram a lei em simulações e em eleições reais e concluem que conformidade e desvios não seguem nenhum padrão."
    sections:
      title: "Por que contagens por seção não obedecem à lei"
      p1: "Uma seção tem no máximo algumas centenas de eleitores. Numa seção de 300 eleitores, um candidato com 40% dos votos terá algo perto de 120, quase sempre entre 100 e 140. Como o tamanho da seção é limitado e o percentual do candidato fica perto da média, as contagens se concentram numa faixa estreita: o primeiro dígito passa a refletir onde essa faixa cai (em seções de 200 eleitores esse candidato fica nos 80, em seções de 300 nos 120), e não uma lei sobre números. A premissa de várias ordens de grandeza não se cumpre, e isso acontece sem manipulação alguma."
    second:
      title: "O que o 2º dígito e a linha de base acrescentam"
      p1: "O segundo dígito é bem menos sensível a esse efeito e é o teste recomendado na literatura de forense eleitoral (Mebane, 2006, propôs o teste do 2º dígito para contagens de seções). Mesmo assim, contagens de seção não o seguem exatamente."
      p2: "Por isso cada recorte traz uma linha de base: para cada seção sorteamos uma contagem binomial com o tamanho real da seção (nominais, brancos e nulos) e o percentual do candidato no município; para municípios, o percentual da UF; para UFs, o do país. São 200 réplicas com semente fixa, e guardamos a média e o envelope de 2,5% a 97,5% de cada dígito. O gráfico mostra o observado, a Lei de Benford e esse envelope, e só marcamos desvios do observado fora do envelope simulado."
    flag:
      title: "O que um desvio sinalizado pode e não pode significar"
      p1: "Ainda assim, estar fora do envelope não prova nada. A linha de base só tem o acaso binomial: heterogeneidade entre bairros e urnas, geografia, comparecimento, transferência de eleitores entre seções, arredondamentos e erros de digitação alargam o envelope de forma legítima. Um desvio sinalizado pode indicar que o processo real difere do modelo simples; não identifica a causa, não mede intenção e não localiza responsabilidades. A ausência de desvio também não prova que tudo está correto."
      p2: "Num recorte com centenas de milhares de seções o envelope fica muito estreito e quase todo observado cai fora dele, em geral abaixo (mais próximo de Benford, porque as seções reais são mais heterogêneas que o modelo). Por isso olhe o tamanho da diferença (MAD e índice ajustado), não só se está dentro ou fora."
    read:
      title: "Como ler MAD, χ² e N"
      p1: "MAD é a média do desvio absoluto entre a proporção observada de cada dígito e a esperada. Nigrini (2012) propõe faixas empíricas: 1º dígito, até 0,006 conformidade próxima, até 0,012 aceitável, até 0,015 marginal e acima disso não conformidade; 2º dígito, 0,008, 0,010 e 0,012; dois primeiros dígitos, 0,0012, 0,0018 e 0,0022. As faixas medem distância à lei, não manipulação, e não existem para o último dígito."
      p2: "O χ² de Pearson compara contagens e, com N de centenas de milhares, rejeita a Lei de Benford sempre (valor-p praticamente zero), mesmo para desvios minúsculos. Por isso a leitura se apoia no tamanho do desvio (MAD, z de cada dígito com correção de continuidade e faixa de 95%) e no envelope simulado."
      p3: "N é a quantidade de valores que têm o dígito. Abaixo do N mínimo mostramos apenas \"amostra pequena\": é o menor N em que o dígito mais raro é esperado pelo menos 5 vezes (1º dígito: {minD1}; 2º: {minD2}; dois primeiros: {minD12}; último: {minLast}). Além disso o MAD tem um piso de ruído: com N pequeno nem uma amostra perfeita alcança a faixa de conformidade próxima, e o MAD esperado só pelo acaso aparece nas medidas."
    included:
      title: "O que está incluído"
      sections: "Seções: contagens de cada seção (unidade principal); municípios e UFs como unidades secundárias (votos totais de cada município ou UF; municípios e UFs excluem o exterior)."
      president: "Presidente: candidatos com pelo menos {nationalShare} dos votos nominais no país, com o mesmo critério nas UFs; os com {munNationalShare} ou mais, e o total nominal, também em municípios com {munSections} seções ou mais."
      local: "Governador e senador: candidatos com pelo menos {localShare} dos votos nominais da UF; os com {bigShare} ou mais também têm as unidades município e UF, e os com {munLocalShare} ou mais, municípios com {munSectionsOther} seções ou mais."
      deputies: "Deputados: totais por UF e blocos de partido (os dois primeiros dígitos do número) com pelo menos {localShare} dos votos nominais."
      totals: "Totais da seção: nominais, brancos e nulos."
      digits: "Dois primeiros dígitos: presidente e totais nominais (país e UFs), e só onde N chega a {minD12}. Municípios aparecem só quando têm seções suficientes."
    sources:
      title: "Referências conferidas"
      deckert: "Deckert, J.; Myagkov, M.; Ordeshook, P. C. Benford's Law and the Detection of Election Fraud. Political Analysis 19(3), 2011, p. 245-268."
      mebane: "Mebane, W. R. Election Forensics: Vote Counts and Benford's Law (2006), teste do segundo dígito."
