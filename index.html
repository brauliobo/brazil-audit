<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Auditoria eleitoral</title>
  <!-- GitHub Pages 404.html sends unknown paths here as /?/path&query: restore the real URL before the app starts -->
  <script>(function (l) { if (l.search[1] === '/') { var d = l.search.slice(1).split('&').map(function (s) { return s.replace(/~and~/g, '&') }).join('?'); history.replaceState(null, null, l.pathname.slice(0, -1) + d + l.hash) } })(location)</script>
  <meta name="color-scheme" content="light dark">
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
